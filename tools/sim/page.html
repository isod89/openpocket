<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-only -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenPocket simulator</title>
<style>
  :root { color-scheme: dark; --bg: #14161a; --panel: #1e2127; --line: #323741; --txt: #e6e8ec; --dim: #8b92a0; --acc: #ff9f1a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--txt); font: 15px/1.4 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: .5rem 1.5rem; align-items: baseline; padding: .75rem 1rem; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 1.1rem; }
  header a { color: var(--acc); }
  #conn { color: var(--dim); margin-left: auto; }
  main { display: flex; flex-wrap: wrap; gap: 1rem; padding: 1rem; align-items: flex-start; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: .75rem; }
  h2 { margin: 0 0 .5rem; font-size: .8rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
  #screen { display: block; width: min(480px, 90vw); aspect-ratio: 1; image-rendering: pixelated; background: #000; border-radius: 4px; }
  .pad { display: grid; grid-template-columns: repeat(3, minmax(4.5rem, 1fr)); gap: .4rem; }
  button { font: inherit; color: var(--txt); background: #2b3039; border: 1px solid var(--line); border-radius: 6px; padding: .5rem .6rem; cursor: pointer; }
  button:hover { border-color: var(--acc); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  .fs { grid-column: span 3; display: grid; grid-template-columns: 1fr 1fr; gap: .4rem; }
  .fs button { padding: 1rem; font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; margin-top: .5rem; }
  label { color: var(--dim); }
  input[type=number] { width: 5.5rem; font: inherit; color: var(--txt); background: #101216; border: 1px solid var(--line); border-radius: 6px; padding: .35rem; }
  table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: .15rem .6rem; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  tr.off td:first-child { color: var(--dim); }
  tr.sel td:first-child { color: var(--acc); font-weight: 600; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: .1rem 1rem; margin: 0 0 .75rem; }
  dt { color: var(--dim); } dd { margin: 0; }
  small { color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>OpenPocket simulator</h1>
  <a href="/site/index.html">Installer</a>
  <a href="/site/editor.html">Editor</a>
  <a href="/api/flash" download="openpocket-sim-flash.bin">Download flash</a>
  <button id="reset" type="button">Reset flash</button>
  <span id="conn" role="status">connecting…</span>
</header>
<main>
  <section>
    <h2>Screen</h2>
    <img id="screen" alt="The pedal's screen" src="/api/screen.png">
  </section>
  <section id="controls">
    <h2>Controls</h2>
    <div class="pad">
      <div class="fs"><button data-press="fs_dn" title="Left footswitch (ArrowDown)">▼ footswitch</button><button data-press="fs_up" title="Right footswitch (ArrowUp)">▲ footswitch</button></div>
      <button data-press="fx">FX</button><button data-press="home" title="Home (Escape)">HOME</button><button data-press="push" title="Push (Enter)">PUSH</button>
      <button data-press="mod">MOD</button><button data-press="amp">AMP</button><button data-press="cab">CAB</button>
      <button data-press="dly">DLY</button><button data-press="rev">REV</button><span></span>
    </div>
    <div class="row">
      <button data-knob="-1" title="Knob left (ArrowLeft)">⟲ knob</button><button data-knob="1" title="Knob right (ArrowRight)">knob ⟳</button>
      <button data-knob="-5">⟲ ×5</button><button data-knob="5">×5 ⟳</button>
    </div>
    <div class="row">
      <button data-press="push_long">Hold PUSH (save)</button><button data-press="dpush">Double PUSH (move)</button><button data-press="home_long">Hold HOME (tuner, diagnostics)</button><button data-press="feet">Both footswitches (tuner)</button>
    </div>
    <div class="row"><label for="vol">Volume knob</label><input id="vol" type="range" min="0" max="100" value="80"> <output id="volv">80</output></div>
    <div class="row"><label for="bat">Battery mV</label><input id="bat" type="number" min="0" max="6000" step="10" value="3920">
      <label for="usb">USB mV</label><input id="usb" type="number" min="0" max="6000" step="100" value="0"></div>
    <div class="row"><label for="hz">Tuner pitch Hz</label><input id="hz" type="number" min="0" max="5000" step="0.5" value="0"></div>
    <p><small>Keys: arrows = footswitches (up/down) and knob (left/right), Enter = PUSH, Escape = HOME.</small></p>
  </section>
  <section>
    <h2>State</h2>
    <dl id="facts"></dl>
    <table id="blocks"></table>
  </section>
</main>
<script>
const LABELS = ["GT", "CMP", "PIT", "SFX", "DRV", "AMP", "CAB", "EQ", "MOD", "DLY", "REV", "SYN"];
const $ = (id) => document.getElementById(id);
const call = (path, method = "POST") => fetch(path, { method }).then((r) => r.json());
let frame = -1;
async function refresh() {
  try {
    const s = await (await fetch("/api/state")).json();
    if (s.error) throw new Error(s.error);
    $("conn").textContent = "connected";
    if (s.frame !== frame) { frame = s.frame; $("screen").src = "/api/screen.png?" + frame; }
    const facts = { Slot: `${s.slot + 1}${s.saved ? "" : " (factory)"}`, Name: s.name + (s.dirty ? "  · edited" : ""), Page: s.mode,
      "Focused block": LABELS[s.block], Volume: s.volume, Battery: s.usb_mv > 4300 ? "USB" : `${s.battery_mv} mV`,
      DSP: `${s.dsp.load}%${s.dsp.bypass ? " bypass" : ""}`, "Last press": `${s.last_press || "none"} (${s.presses})`, "Flash writes": s.writes_ok ? "ok" : "REFUSED" };
    $("facts").replaceChildren(...Object.entries(facts).flatMap(([k, v]) => { const dt = document.createElement("dt"), dd = document.createElement("dd"); dt.textContent = k; dd.textContent = v; return [dt, dd]; }));
    const t = $("blocks");
    t.replaceChildren();
    for (const b of s.preset.order) {
      const tr = t.insertRow(); tr.className = (s.preset.on[b] ? "" : "off ") + (b === s.block ? "sel" : "");
      tr.insertCell().textContent = `${LABELS[b]} ${s.preset.on[b] ? "on" : "off"}`;
      for (const v of s.preset.p[b]) tr.insertCell().textContent = v;
    }
  } catch (e) { $("conn").textContent = "not connected: " + e.message; }
}
document.addEventListener("click", async (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.press) await call("/api/press/" + b.dataset.press);
  else if (b.dataset.knob) await call("/api/knob/" + b.dataset.knob);
  else if (b.id === "reset" && confirm("Erase the simulated pedal's flash (all saved presets)?")) { await call("/api/reset"); frame = -1; }
  refresh();
});
$("vol").oninput = async () => { $("volv").textContent = $("vol").value; await call("/api/volume/" + $("vol").value); refresh(); };
$("bat").onchange = $("usb").onchange = async () => { await call(`/api/battery/${$("bat").value}/${$("usb").value}`); refresh(); };
$("hz").onchange = async () => { await call("/api/tuner/" + $("hz").value); refresh(); };
document.addEventListener("keydown", async (e) => {
  if (e.target.closest("input") || e.metaKey || e.ctrlKey || e.altKey) return;
  const m = { ArrowUp: "/api/press/fs_up", ArrowDown: "/api/press/fs_dn", Enter: "/api/press/push", Escape: "/api/press/home", ArrowLeft: "/api/knob/-1", ArrowRight: "/api/knob/1" }[e.key];
  if (m && !(e.key === "Enter" && e.target.closest("button"))) { e.preventDefault(); await call(m); refresh(); }
});
refresh(); setInterval(refresh, 250);
</script>
</body>
</html>
