name: build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the container, the firmware and the installer packages (it fails when they are not the release's bytes)
        run: node tools/op.mjs package
      - uses: actions/upload-artifact@v4
        with:
          name: openpocket-build
          path: |
            firmware/openpocket.bin
            docs/firmware/*.fwsc
            docs/firmware/manifest.json
            build/SHA256SUMS
      - name: Build the MIDI test channel package (never the installer default)
        run: node tools/op.mjs package-test
      - uses: actions/upload-artifact@v4
        with:
          name: openpocket-midi-test
          path: |
            firmware/openpocket-midi-test.bin
            docs/firmware/midi-test/
            build/SHA256SUMS-midi-test
      - name: Build STARTER, the alternative firmware to start from (it fails when the base needs a name from OpenPocket)
        run: node tools/op.mjs app starter
      - uses: actions/upload-artifact@v4
        with:
          name: openpocket-app-starter
          path: |
            build/apps/starter/starter.bin
            build/apps/starter/*.fwsc
            build/apps/starter/manifest.json
            build/apps/starter/SHA256SUMS
      - name: Host tests, also with the packages of both products built above
        run: node tools/op.mjs test --built
